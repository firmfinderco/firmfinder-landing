<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FirmFinder — The Home of Prop Firms</title>
  <meta name="description" content="Join the FirmFinder waitlist for verified prop-firm listings, sponsorships, and exclusive partnerships.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg-stars" aria-hidden="true"></div>
  <header class="container">
    <div class="brand">
      <img src="/assets/firmfinder-logo.png" alt="FirmFinder logo" class="logo" />
      <span class="wordmark">FirmFinder</span>
    </div>
  </header>

  <main class="container hero">
    <section class="glass-card">
      <div class="logo-wrap" role="img" aria-label="FirmFinder glass emblem">
        <img src="/assets/firmfinder-logo.png" alt="" class="floating-logo" />
        <div class="glow"></div>
      </div>

      <h1>The Home of Prop Firms</h1>
      <p class="sub">A verified, global directory connecting traders, creators, and prop firms.<br>Be first to access listings, sponsorships, and premium partner offers.</p>

      <form class="signup" method="POST" action="https://formsubmit.co/YOUR_EMAIL@FIRMFINDER.CO">
        <!-- Replace the email above with your GoDaddy inbox. -->
        <input type="hidden" name="_subject" value="New FirmFinder Waitlist Signup">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://YOUR-DOMAIN/thank-you.html">
        <label class="sr-only" for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="Enter your email" required>
        <button type="submit" class="cta">Join the Waitlist</button>
      </form>

      <div class="trust">
        <span class="pill">Verified Network</span>
        <span class="pill">Global Positioning</span>
        <span class="pill">Apple‑grade Design</span>
      </div>

      <div class="socials" aria-label="Social links">
        <a href="https://instagram.com/firmfinder" target="_blank" rel="noopener" class="social">IG</a>
        <a href="https://x.com/firmfinder" target="_blank" rel="noopener" class="social">X</a>
        <a href="https://discord.gg/YOURCODE" target="_blank" rel="noopener" class="social">Discord</a>
      </div>
    </section>
  </main>

  <footer class="container footer">
    <small>© FirmFinder 2025. All rights reserved.</small>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
